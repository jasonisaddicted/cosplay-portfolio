  <script>
    // Sync breadcrumb title after album loads
    document.addEventListener('DOMContentLoaded', () => {
      const crumb = document.getElementById('album-title-crumb');
      const title = document.getElementById('album-title');
      if (crumb && title) {
        const observer = new MutationObserver(() => {
          crumb.textContent = title.textContent;
        });
        observer.observe(title, { childList: true, characterData: true, subtree: true });
      }
    });
  </script>
  <script>
    (function () {
      const toggle = document.getElementById('mob-toggle');
      const modal  = document.getElementById('mob-modal');
      const close  = document.getElementById('mob-close');
      const iframe = document.getElementById('mob-iframe');
      toggle.addEventListener('click', () => {
        iframe.src = window.location.href;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
      function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        iframe.src = '';
      }
      close.addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    })();
  </script>
