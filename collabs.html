<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborators — Cosplay Portfolio</title>
  <link rel="stylesheet" href="css/style.css?v=49">
</head>
<body class="page-collabs">

  <!-- Navigation -->
  <nav class="nav scrolled">
    <a class="nav__brand" href="index.html" id="nav-brand">Portfolio</a>
    <button class="nav__hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav__links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="studio.html">Studio</a></li>
      <li><a href="collabs.html">Collabs</a></li>
    </ul>
  </nav>

  <!-- Page Hero -->
  <div class="page-hero mt-nav">
    <div class="page-hero__bg"></div>
    <div class="page-hero__content">
      <div class="page-hero__label">The People Behind The Lens</div>
      <h1 class="page-hero__title">Collaborators</h1>
      <p class="page-hero__sub">Talented cosplayers I've had the privilege to work with — support their craft on Gank</p>
    </div>
  </div>

  <!-- Collab Entries -->
  <div class="collab-list" id="collab-list"></div>

  <!-- Photo Description Panel (Collaborators) - Unified Design -->
  <div class="info-panel__standalone" id="collab-panel-desktop" style="display: none;">
    <div class="info-panel__scroll" id="collab-panel-content-desktop"></div>
    <button class="info-panel__close-btn" aria-label="Close" style="position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke: currentColor; stroke-width: 2;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Photo Description Panel (Collaborators) - Mobile -->
  <div class="info-panel__standalone info-panel__standalone-mobile" id="collab-panel-mobile" style="display: none;">
    <div class="info-panel__mobile-header" style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border);">
      <button class="info-panel__back-btn" aria-label="Back" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; gap: 5px;">
        <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; stroke-width: 2;"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back
      </button>
      <button class="info-panel__close-btn" aria-label="Close" style="background: none; border: none; color: var(--text); cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke: currentColor; stroke-width: 2;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="info-panel__scroll" id="collab-panel-content-mobile"></div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer__brand" id="footer-brand"></span>
    <span class="footer__copy" id="footer-copy"></span>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox__inner">
      <div class="lightbox__img-wrap">
        <img class="lightbox__img" src="" alt="">
        <div class="lightbox__caption"></div>
      </div>
    </div>
    <button class="lightbox__close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <button class="lightbox__back" aria-label="Back" style="display:none;">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      <span>Back</span>
    </button>
    <button class="lightbox__nav lightbox__prev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button class="lightbox__nav lightbox__next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lightbox__counter"></div>
  </div>

  <!-- Mobile Preview Button -->
  <button class="mob-toggle" id="mob-toggle" aria-label="Mobile preview" title="Preview on mobile">
    <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
  </button>
  <div class="mob-modal" id="mob-modal">
    <button class="mob-modal__close" id="mob-close" aria-label="Close preview">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <span class="mob-modal__label">Mobile Preview — 390px</span>
    <div class="phone-frame">
      <div class="phone-frame__notch"></div>
      <div class="phone-frame__screen">
        <iframe id="mob-iframe" src=""></iframe>
      </div>
      <div class="phone-frame__bar"></div>
    </div>
  </div>

  <script src="js/protect.js?v=49"></script>
  <script type="module" src="js/firebase-init.js?v=49"></script>
  <script src="js/app.js?v=49"></script>
  <script>
    document.title = `Collaborators · ${CONFIG.photographer}`;
  </script>
  <script>
    (function () {
      const toggle = document.getElementById('mob-toggle');
      const modal  = document.getElementById('mob-modal');
      const close  = document.getElementById('mob-close');
      const iframe = document.getElementById('mob-iframe');
      toggle.addEventListener('click', () => {
        iframe.src = window.location.href;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
      function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        iframe.src = '';
      }
      close.addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    })();
  </script>
</body>
</html>
