<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosplay Portfolio</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="page-home">

  <!-- Navigation -->
  <nav class="nav">
    <a class="nav__brand" href="index.html" id="nav-brand">Portfolio</a>
    <button class="nav__hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav__links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="studio.html">Studio</a></li>
      <li><a href="collabs.html">Collabs</a></li>
    </ul>
  </nav>

  <!-- Hero -->
  <section class="hero" id="hero" title="View full size">
    <img class="hero__img" src="" alt="">
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <div class="hero__label"><span class="hero-label-text"></span></div>
      <h1 class="hero__character"></h1>
      <p class="hero__series"></p>
      <p class="hero__credit"></p>
    </div>
  </section>

  <!-- Featured Shots Section -->
  <div class="featured-section">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-header__label">This Month</span>
      <h2 class="section-header__title">Featured Shots</h2>
      <span class="section-header__count"></span>
    </div>

    <!-- Featured Grid (6 columns desktop / 2 columns mobile) -->
    <div class="featured-grid-wrapper">
      <div class="featured-grid" id="featured-grid"></div>
    </div>
  </div>

  <!-- Featured Details Panel (Desktop: Right Side) -->
  <div class="featured-panel featured-panel-desktop" id="featured-panel-desktop">
    <div class="featured-panel-header">
      <button class="featured-panel-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="featured-panel-content" id="featured-panel-content-desktop"></div>
  </div>

  <!-- Featured Details Panel (Mobile: Full Screen Overlay) -->
  <div class="featured-panel featured-panel-mobile" id="featured-panel-mobile">
    <div class="featured-panel-header">
      <button class="featured-panel-back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button class="featured-panel-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="featured-panel-content" id="featured-panel-content-mobile"></div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer__brand" id="footer-brand"></span>
    <span class="footer__copy" id="footer-copy"></span>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox__inner">
      <div class="lightbox__img-wrap">
        <img class="lightbox__img" src="" alt="">
        <div class="lightbox__caption"></div>
      </div>
    </div>
    <button class="lightbox__close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <button class="lightbox__nav lightbox__prev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button class="lightbox__nav lightbox__next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lightbox__counter"></div>
  </div>

  <!-- Mobile Preview Button -->
  <button class="mob-toggle" id="mob-toggle" aria-label="Mobile preview" title="Preview on mobile">
    <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
  </button>
  <div class="mob-modal" id="mob-modal">
    <button class="mob-modal__close" id="mob-close" aria-label="Close preview">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <span class="mob-modal__label">Mobile Preview — 390px</span>
    <div class="phone-frame">
      <div class="phone-frame__notch"></div>
      <div class="phone-frame__screen">
        <iframe id="mob-iframe" src=""></iframe>
      </div>
      <div class="phone-frame__bar"></div>
    </div>
  </div>

  <script src="js/protect.js?v=8"></script>
  <script type="module" src="js/firebase-init.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
  <script>
    // Page title (nav/footer set by app.js)
    document.title = `${CONFIG.photographer} · ${CONFIG.tagline}`;
  </script>
  <script>
    (function () {
      const toggle = document.getElementById('mob-toggle');
      const modal  = document.getElementById('mob-modal');
      const close  = document.getElementById('mob-close');
      const iframe = document.getElementById('mob-iframe');
      toggle.addEventListener('click', () => {
        iframe.src = window.location.href;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
      function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        iframe.src = '';
      }
      close.addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });
    })();
  </script>
</body>
</html>
