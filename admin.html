<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel — jianshen.cos.visual</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-size: 16px; }
    body {
      background: #111;
      color: #e4e4e4;
      font-family: monospace;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2e2e2e;
    }
    h1 { font-size: 1.6rem; letter-spacing: 0.1em; }
    button {
      padding: 10px 20px;
      background: #c8a46e;
      border: none;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #dfc08f; }
    button:disabled { background: #555; cursor: not-allowed; color: #999; }

    /* Auth */
    #authScreen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
    #authScreen.active { display: flex; }
    .authForm {
      background: #181818;
      border: 1px solid #2e2e2e;
      padding: 30px;
      max-width: 350px;
      width: 100%;
    }
    .authForm h2 { margin-bottom: 20px; }
    .authForm input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #111;
      border: 1px solid #2e2e2e;
      color: #e4e4e4;
    }
    .authForm .error { color: #ff6b6b; font-size: 0.85rem; }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 1px solid #2e2e2e; }
    .tab { padding: 12px 20px; background: transparent; border: none; color: #666; cursor: pointer; font-weight: 600; }
    .tab.active { color: #c8a46e; border-bottom: 2px solid #c8a46e; }

    /* Content */
    .content { display: none; }
    .content.active { display: block; }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #999; text-transform: uppercase; letter-spacing: 0.08em; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      background: #181818;
      border: 1px solid #2e2e2e;
      color: #e4e4e4;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #c8a46e; }
    textarea { resize: vertical; min-height: 80px; }

    /* File upload */
    .upload-area {
      border: 2px dashed #2e2e2e;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .upload-area:hover { border-color: #c8a46e; }
    .upload-area.dragging { background: rgba(200, 164, 110, 0.1); border-color: #c8a46e; }
    .upload-progress { margin-top: 10px; font-size: 0.85rem; color: #999; }

    /* Items list */
    .items-list { margin-top: 30px; }
    .item {
      background: #181818;
      border: 1px solid #2e2e2e;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 2px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .item-title { font-weight: 600; }
    .item-actions { display: flex; gap: 10px; }
    .item-actions button { padding: 6px 12px; font-size: 0.8rem; }
    .item-photo { width: 80px; height: 100px; object-fit: cover; border-radius: 2px; }

    /* Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-full { grid-column: 1 / -1; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content {
      background: #181818;
      border: 1px solid #2e2e2e;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-close { background: none; border: none; color: #999; font-size: 1.5rem; cursor: pointer; }

    .success { color: #4bc04b; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Admin Panel</h1>
    <button onclick="logout()">Sign Out</button>
  </div>

  <!-- Auth Screen -->
  <div id="authScreen" class="active">
    <div class="authForm">
      <h2>Login</h2>
      <input type="email" id="email" placeholder="Email" value="jianshen.image.visual@gmail.com">
      <input type="password" id="password" placeholder="Password" value="Metro2033_Bf3_new">
      <button onclick="login()" style="width:100%; margin-top:10px;">Sign In</button>
      <div id="authError" class="error" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- Main Content (hidden until logged in) -->
  <div id="mainContent" style="display:none;">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('featured')">Featured</button>
      <button class="tab" onclick="switchTab('events')">Events</button>
      <button class="tab" onclick="switchTab('studio')">Studio</button>
      <button class="tab" onclick="switchTab('collabs')">Collabs</button>
    </div>

    <!-- Featured Picks -->
    <div id="featured" class="content active">
      <h2 style="margin-bottom:20px;">Featured Picks</h2>
      <div class="grid grid-full">
        <div>
          <h3 style="margin-bottom:15px;">Add New Featured Pick</h3>
          <div class="form-group">
            <label>Upload Photo</label>
            <div class="upload-area" id="uploadFeatured" onclick="document.getElementById('uploadFeaturFile').click()">
              <p>Click or drag to upload</p>
              <input type="file" id="uploadFeaturFile" accept="image/*" style="display:none;">
            </div>
            <div class="upload-progress" id="uploadFeatureStatus"></div>
          </div>
          <div class="form-group">
            <label>Photo URL</label>
            <input type="text" id="featuredSrc" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Character Name</label>
            <input type="text" id="featuredChar" placeholder="e.g., Hu Tao">
          </div>
          <div class="form-group">
            <label>Series</label>
            <input type="text" id="featuredSeries" placeholder="e.g., Genshin Impact">
          </div>
          <div class="form-group">
            <label>Cosplayer Handle</label>
            <input type="text" id="featuredCredit" placeholder="e.g., @sakurahime_cos">
          </div>
          <div class="form-group">
            <label>Order (priority)</label>
            <input type="number" id="featuredOrder" placeholder="1" value="1">
          </div>
          <button onclick="saveFeatured()" style="width:100%;">Save Featured Pick</button>
          <div id="featureMsg" style="margin-top:10px; font-size:0.85rem;"></div>
        </div>
      </div>

      <div class="items-list" id="featuredList"></div>
    </div>

    <!-- Events -->
    <div id="events" class="content">
      <h2 style="margin-bottom:20px;">Events</h2>
      <div class="form-group" style="max-width:400px;">
        <label>Event Name</label>
        <input type="text" id="eventName" placeholder="e.g., FanimeCon 2024">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Date</label>
        <input type="text" id="eventDate" placeholder="e.g., May 2024">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Location</label>
        <input type="text" id="eventLoc" placeholder="e.g., San Jose, CA">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Description</label>
        <textarea id="eventDesc" placeholder="Event description..."></textarea>
      </div>
      <button onclick="saveEvent()" style="max-width:400px; width:100%;">Create Event</button>
      <div id="eventMsg" style="margin-top:10px; font-size:0.85rem;"></div>
      <div class="items-list" id="eventsList"></div>
    </div>

    <!-- Studio -->
    <div id="studio" class="content">
      <h2 style="margin-bottom:20px;">Studio Sessions</h2>

      <div style="background:#181818; border:1px solid #2e2e2e; padding:20px; margin-bottom:30px;">
        <h3 style="margin-bottom:15px;">Batch Upload Photos</h3>
        <div class="form-group">
          <label>Drop all photos here</label>
          <div class="upload-area" id="uploadStudioBatch" onclick="document.getElementById('uploadStudioFiles').click()">
            <p>Click or drag multiple photos</p>
            <input type="file" id="uploadStudioFiles" accept="image/*" multiple style="display:none;">
          </div>
          <div class="upload-progress" id="uploadStudioStatus"></div>
        </div>
        <div class="form-group">
          <label>Character Name</label>
          <input type="text" id="batchCharacter" placeholder="e.g., Hu Tao">
        </div>
        <div class="form-group">
          <label>Series</label>
          <input type="text" id="batchSeries" placeholder="e.g., Genshin Impact">
        </div>
        <div class="form-group">
          <label>Cosplayer Handle</label>
          <input type="text" id="batchHandle" placeholder="e.g., @sakurahime_cos">
        </div>
        <div class="form-group">
          <label>Session Name</label>
          <input type="text" id="batchSessionName" placeholder="e.g., Genshin Impact Session">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="text" id="batchSessionDate" placeholder="e.g., January 2025">
        </div>
        <button onclick="saveBatchStudio()" style="width:100%;">Upload & Create Session</button>
        <div id="batchMsg" style="margin-top:10px; font-size:0.85rem;"></div>
      </div>

      <hr style="border:none; border-top:1px solid #2e2e2e; margin:30px 0;">

      <h3 style="margin-bottom:15px;">Or Create Manually</h3>
      <div class="form-group" style="max-width:400px;">
        <label>Session Name</label>
        <input type="text" id="studioName" placeholder="e.g., Genshin Impact Session">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Date</label>
        <input type="text" id="studioDate" placeholder="e.g., January 2025">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Description</label>
        <textarea id="studioDesc" placeholder="Session description..."></textarea>
      </div>
      <button onclick="saveStudio()" style="max-width:400px; width:100%;">Create Studio Session</button>
      <div id="studioMsg" style="margin-top:10px; font-size:0.85rem;"></div>
      <div class="items-list" id="studioList"></div>
    </div>

    <!-- Collabs -->
    <div id="collabs" class="content">
      <h2 style="margin-bottom:20px;">Collaborators</h2>
      <div class="form-group" style="max-width:400px;">
        <label>Cosplayer Name</label>
        <input type="text" id="collabName" placeholder="e.g., Sakura Hime">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Handle</label>
        <input type="text" id="collabHandle" placeholder="e.g., @sakurahime_cos">
      </div>
      <div class="form-group" style="max-width:400px;">
        <label>Bio</label>
        <textarea id="collabBio" placeholder="Short bio..."></textarea>
      </div>
      <button onclick="saveCollab()" style="max-width:400px; width:100%;">Add Collaborator</button>
      <div id="collabMsg" style="margin-top:10px; font-size:0.85rem;"></div>
      <div class="items-list" id="collabList"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, doc, deleteDoc, getDocs, query, orderBy
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import {
    getStorage, ref, uploadBytes, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAxdGpFkLtnceC1foAXMQbHQ5xh2jgW4M",
    authDomain: "jianshencosvisual-328dc.firebaseapp.com",
    projectId: "jianshencosvisual-328dc",
    storageBucket: "jianshencosvisual-328dc.firebasestorage.app",
    messagingSenderId: "190010774007",
    appId: "1:190010774007:web:fe4e23c6170d5d458a1ef2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  // ─ Global ─
  window.login = async () => {
    const email = document.getElementById('email').value;
    const pwd = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('mainContent').style.display = 'block';
      loadFeatured();
      loadEvents();
      loadStudio();
      loadCollabs();
    } catch (err) {
      document.getElementById('authError').textContent = 'Login failed: ' + err.message;
    }
  };

  window.logout = async () => {
    await signOut(auth);
    document.getElementById('authScreen').classList.add('active');
    document.getElementById('mainContent').style.display = 'none';
  };

  window.switchTab = (tab) => {
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
  };

  // ─ Featured ─
  window.saveFeatured = async () => {
    const src = document.getElementById('featuredSrc').value || '';
    const character = document.getElementById('featuredChar').value;
    const series = document.getElementById('featuredSeries').value;
    const credit = document.getElementById('featuredCredit').value;
    const order = parseInt(document.getElementById('featuredOrder').value) || 1;

    if (!character || !series) {
      document.getElementById('featureMsg').textContent = 'Please fill in all fields';
      document.getElementById('featureMsg').className = 'error';
      return;
    }

    try {
      await addDoc(collection(db, 'featured'), { src, character, series, credit, order });
      document.getElementById('featureMsg').textContent = '✓ Saved!';
      document.getElementById('featureMsg').className = 'success';
      document.getElementById('featuredChar').value = '';
      document.getElementById('featuredSeries').value = '';
      document.getElementById('featuredCredit').value = '';
      document.getElementById('featuredSrc').value = '';
      loadFeatured();
      setTimeout(() => { document.getElementById('featureMsg').textContent = ''; }, 3000);
    } catch (err) {
      document.getElementById('featureMsg').textContent = 'Error: ' + err.message;
      document.getElementById('featureMsg').className = 'error';
    }
  };

  window.loadFeatured = async () => {
    const q = query(collection(db, 'featured'), orderBy('order'));
    const snap = await getDocs(q);
    const html = snap.docs.map(doc => {
      const d = doc.data();
      return `
        <div class="item">
          <div class="item-header">
            <div>
              <div class="item-title">${d.character} — ${d.series}</div>
              <div style="font-size:0.8rem; color:#666;">${d.credit}</div>
            </div>
            <div class="item-actions">
              <button onclick="deleteFeatured('${doc.id}')">Delete</button>
            </div>
          </div>
          ${d.src ? `<img src="${d.src}" alt="" class="item-photo">` : ''}
        </div>
      `;
    }).join('');
    document.getElementById('featuredList').innerHTML = html || '<p style="color:#666;">No featured picks yet</p>';
  };

  window.deleteFeatured = async (id) => {
    if (confirm('Delete this featured pick?')) {
      await deleteDoc(doc(db, 'featured', id));
      loadFeatured();
    }
  };

  // ─ Events ─
  window.saveEvent = async () => {
    const name = document.getElementById('eventName').value;
    const date = document.getElementById('eventDate').value;
    const location = document.getElementById('eventLoc').value;
    const description = document.getElementById('eventDesc').value;

    if (!name) {
      document.getElementById('eventMsg').textContent = 'Event name required';
      document.getElementById('eventMsg').className = 'error';
      return;
    }

    try {
      await addDoc(collection(db, 'events'), {
        name, date, location, description, photos: [], cosplayers: []
      });
      document.getElementById('eventMsg').textContent = '✓ Event created!';
      document.getElementById('eventMsg').className = 'success';
      document.getElementById('eventName').value = '';
      document.getElementById('eventDate').value = '';
      document.getElementById('eventLoc').value = '';
      document.getElementById('eventDesc').value = '';
      loadEvents();
      setTimeout(() => { document.getElementById('eventMsg').textContent = ''; }, 3000);
    } catch (err) {
      document.getElementById('eventMsg').textContent = 'Error: ' + err.message;
      document.getElementById('eventMsg').className = 'error';
    }
  };

  window.loadEvents = async () => {
    const snap = await getDocs(collection(db, 'events'));
    const html = snap.docs.map(doc => {
      const d = doc.data();
      return `
        <div class="item">
          <div class="item-header">
            <div>
              <div class="item-title">${d.name}</div>
              <div style="font-size:0.8rem; color:#666;">${d.date} · ${d.location}</div>
            </div>
            <div class="item-actions">
              <button onclick="deleteEvent('${doc.id}')">Delete</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('eventsList').innerHTML = html || '<p style="color:#666;">No events yet</p>';
  };

  window.deleteEvent = async (id) => {
    if (confirm('Delete this event?')) {
      await deleteDoc(doc(db, 'events', id));
      loadEvents();
    }
  };

  // ─ Studio ─
  window.saveBatchStudio = async () => {
    const files = document.getElementById('uploadStudioFiles').files;
    const character = document.getElementById('batchCharacter').value;
    const series = document.getElementById('batchSeries').value;
    const handle = document.getElementById('batchHandle').value;
    const sessionName = document.getElementById('batchSessionName').value;
    const sessionDate = document.getElementById('batchSessionDate').value;

    if (!files.length || !character || !series || !handle || !sessionName) {
      document.getElementById('batchMsg').textContent = 'Please fill in all fields and select photos';
      document.getElementById('batchMsg').className = 'error';
      return;
    }

    const status = document.getElementById('uploadStudioStatus');
    status.textContent = `Uploading ${files.length} photos...`;

    try {
      const photos = [];
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        status.textContent = `Uploading ${i + 1}/${files.length}...`;

        const storageRef = ref(storage, `photos/studio/${Date.now()}_${i}_${file.name}`);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        photos.push({ src: url });
      }

      // Create studio session with all photos
      await addDoc(collection(db, 'studio'), {
        name: sessionName,
        date: sessionDate,
        description: '',
        cover: photos[0]?.src || '',
        cosplayers: [
          {
            name: character,
            handle: handle,
            character: character,
            series: series,
            photos: photos
          }
        ]
      });

      document.getElementById('batchMsg').textContent = `✓ ${files.length} photos uploaded & session created!`;
      document.getElementById('batchMsg').className = 'success';
      document.getElementById('uploadStudioFiles').value = '';
      document.getElementById('batchCharacter').value = '';
      document.getElementById('batchSeries').value = '';
      document.getElementById('batchHandle').value = '';
      document.getElementById('batchSessionName').value = '';
      document.getElementById('batchSessionDate').value = '';
      document.getElementById('uploadStudioStatus').textContent = '';
      loadStudio();
      setTimeout(() => { document.getElementById('batchMsg').textContent = ''; }, 3000);
    } catch (err) {
      document.getElementById('batchMsg').textContent = 'Error: ' + err.message;
      document.getElementById('batchMsg').className = 'error';
    }
  };

  window.saveStudio = async () => {
    const name = document.getElementById('studioName').value;
    const date = document.getElementById('studioDate').value;
    const description = document.getElementById('studioDesc').value;

    if (!name) {
      document.getElementById('studioMsg').textContent = 'Session name required';
      document.getElementById('studioMsg').className = 'error';
      return;
    }

    try {
      await addDoc(collection(db, 'studio'), {
        name, date, description, cosplayers: []
      });
      document.getElementById('studioMsg').textContent = '✓ Studio session created!';
      document.getElementById('studioMsg').className = 'success';
      document.getElementById('studioName').value = '';
      document.getElementById('studioDate').value = '';
      document.getElementById('studioDesc').value = '';
      loadStudio();
      setTimeout(() => { document.getElementById('studioMsg').textContent = ''; }, 3000);
    } catch (err) {
      document.getElementById('studioMsg').textContent = 'Error: ' + err.message;
      document.getElementById('studioMsg').className = 'error';
    }
  };

  window.loadStudio = async () => {
    const snap = await getDocs(collection(db, 'studio'));
    const html = snap.docs.map(doc => {
      const d = doc.data();
      return `
        <div class="item">
          <div class="item-header">
            <div>
              <div class="item-title">${d.name}</div>
              <div style="font-size:0.8rem; color:#666;">${d.date}</div>
            </div>
            <div class="item-actions">
              <button onclick="deleteStudio('${doc.id}')">Delete</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('studioList').innerHTML = html || '<p style="color:#666;">No studio sessions yet</p>';
  };

  window.deleteStudio = async (id) => {
    if (confirm('Delete this studio session?')) {
      await deleteDoc(doc(db, 'studio', id));
      loadStudio();
    }
  };

  // ─ Collabs ─
  window.saveCollab = async () => {
    const name = document.getElementById('collabName').value;
    const handle = document.getElementById('collabHandle').value;
    const bio = document.getElementById('collabBio').value;

    if (!name || !handle) {
      document.getElementById('collabMsg').textContent = 'Name and handle required';
      document.getElementById('collabMsg').className = 'error';
      return;
    }

    try {
      await addDoc(collection(db, 'collaborators'), {
        name, handle, bio, cover: '', gankUrl: '', photos: []
      });
      document.getElementById('collabMsg').textContent = '✓ Collaborator added!';
      document.getElementById('collabMsg').className = 'success';
      document.getElementById('collabName').value = '';
      document.getElementById('collabHandle').value = '';
      document.getElementById('collabBio').value = '';
      loadCollabs();
      setTimeout(() => { document.getElementById('collabMsg').textContent = ''; }, 3000);
    } catch (err) {
      document.getElementById('collabMsg').textContent = 'Error: ' + err.message;
      document.getElementById('collabMsg').className = 'error';
    }
  };

  window.loadCollabs = async () => {
    const snap = await getDocs(collection(db, 'collaborators'));
    const html = snap.docs.map(doc => {
      const d = doc.data();
      return `
        <div class="item">
          <div class="item-header">
            <div>
              <div class="item-title">${d.name}</div>
              <div style="font-size:0.8rem; color:#666;">${d.handle}</div>
            </div>
            <div class="item-actions">
              <button onclick="deleteCollab('${doc.id}')">Delete</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('collabList').innerHTML = html || '<p style="color:#666;">No collaborators yet</p>';
  };

  window.deleteCollab = async (id) => {
    if (confirm('Delete this collaborator?')) {
      await deleteDoc(doc(db, 'collaborators', id));
      loadCollabs();
    }
  };

  // ─ File upload ─
  document.getElementById('uploadFeaturFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const status = document.getElementById('uploadFeatureStatus');
    status.textContent = 'Uploading...';

    try {
      const storageRef = ref(storage, `photos/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      document.getElementById('featuredSrc').value = url;
      status.textContent = '✓ Uploaded!';
      status.className = 'success';
      setTimeout(() => { status.textContent = ''; }, 2000);
    } catch (err) {
      status.textContent = 'Upload failed: ' + err.message;
      status.className = 'error';
    }
  });

  // ─ Drag & drop ─
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
    document.getElementById('uploadFeatured').addEventListener(evt, e => {
      e.preventDefault();
      e.stopPropagation();
    });
  });
  document.getElementById('uploadFeatured').addEventListener('dragover', () => {
    document.getElementById('uploadFeatured').classList.add('dragging');
  });
  document.getElementById('uploadFeatured').addEventListener('dragleave', () => {
    document.getElementById('uploadFeatured').classList.remove('dragging');
  });
  document.getElementById('uploadFeatured').addEventListener('drop', (e) => {
    document.getElementById('uploadFeatured').classList.remove('dragging');
    const file = e.dataTransfer.files[0];
    if (file) {
      document.getElementById('uploadFeaturFile').files = e.dataTransfer.files;
      document.getElementById('uploadFeaturFile').dispatchEvent(new Event('change', { bubbles: true }));
    }
  });

  // Batch upload drag & drop
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
    document.getElementById('uploadStudioBatch').addEventListener(evt, e => {
      e.preventDefault();
      e.stopPropagation();
    });
  });
  document.getElementById('uploadStudioBatch').addEventListener('dragover', () => {
    document.getElementById('uploadStudioBatch').classList.add('dragging');
  });
  document.getElementById('uploadStudioBatch').addEventListener('dragleave', () => {
    document.getElementById('uploadStudioBatch').classList.remove('dragging');
  });
  document.getElementById('uploadStudioBatch').addEventListener('drop', (e) => {
    document.getElementById('uploadStudioBatch').classList.remove('dragging');
    if (e.dataTransfer.files.length) {
      document.getElementById('uploadStudioFiles').files = e.dataTransfer.files;
    }
  });
</script>

</body>
</html>
